name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: invest
          POSTGRES_USER: invest
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U invest" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: A3 铁律：无交易执行代码（合并阻断）
        run: python scripts/check_a3_no_trading.py
      - name: 业务时限口径 lint（合并阻断）
        run: python scripts/lint_business_duration.py
      - name: ruff
        run: ruff check src tests
      - name: 金标准回归 + 单元测试（合并阻断）
        env:
          TEST_DATABASE_URL: postgresql://invest:ci@localhost:5432/invest
        run: pytest
