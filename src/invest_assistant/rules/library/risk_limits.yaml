# 风控层限额与纪律规则（任务 18；需求 R15.1-R15.6）
# 出处：框架 v2.0 第六章 6.1/6.4/6.5、6.6，第四章 4.1-4.3，第二章 2.3，第一章 1.3，
#       第七章 7.3，附录 C/D。组合类型 = 高风险成长型（个人参数表 v1.1 签署）。
# 取值约定：*_param 键引用 params_signed.yaml 参数名（经 ParamStore.resolve，享受覆盖/签署链）；
# 其余为 params_signed.yaml 未登记的框架常量，在此以规则条目落值并挂框架出处（R5.1，代码零硬编码）。
rules:
  - id: RISK.POSITION.INITIAL
    source: "F 6.1（单票初始 ≤10%；小盘票一律 ≤5%）"
    type: threshold
    effect_level: 3
    conservative_direction: "上限只降"
    params:
      cap_param: position.initial_max_pct
      smallcap_cap_param: position.initial_max_pct_smallcap
  - id: RISK.POSITION.HARDCAP
    source: "F 6.1（单票硬顶：高风险 20%；小盘 10%）"
    type: threshold
    effect_level: 3
    conservative_direction: "上限只降"
    params:
      cap_param: position.hard_cap_pct
      smallcap_cap_pct: 10          # params_signed 未登记：小盘硬顶（F 6.1 / 4.3）
  - id: RISK.SUBINDUSTRY.CAP
    source: "F 6.1（单一子行业 ≤30%）"
    type: threshold
    effect_level: 3
    params:
      max_pct: 30
  - id: RISK.THEME.CAP
    source: "F 6.1 / 4.3（主题穿透 ≤50%，按穿透映射表，季度更新）"
    type: threshold
    effect_level: 3
    params:
      max_pct: 50
  - id: RISK.AI.EXPOSURE.CAP
    source: "F 6.1 / 4.3（高风险型 AI 总敞口 ≤85%，含 ETF 成分穿透折算）"
    type: threshold
    effect_level: 3
    params:
      max_pct: 85
  - id: RISK.CASH.FLOOR
    source: "F 6.1 / 6.4（高风险常态 ≥15%；过热 ≥30%；狂热 40-50% 取下沿 40%；冰点按常态档）"
    type: threshold
    effect_level: 3
    conservative_direction: "下限只升"
    params:
      normal_param: cash.floor_normal_pct
      overheat_param: cash.floor_overheat_pct
      mania_floor_pct: 40           # params_signed 未登记：狂热档现金下沿（F 6.4）
  - id: RISK.BUDGET.FIRST_BATCH
    source: "F 6.1（单票风险预算：首批仓位 × 止损距离 ≤ 组合净值 2%）"
    type: threshold
    effect_level: 3
    params:
      budget_param: risk.budget_pct
  - id: RISK.HOLDINGS.MAX
    source: "F 4.1（高风险成长型持股 5-8 只，上限 8）"
    type: threshold
    effect_level: 1
    params:
      max_param: portfolio.max_holdings
  - id: RISK.SHOVEL.RATIO
    source: "F 2.3-1（高风险型卖铲子占比 ≥40%，按持仓市值）"
    type: threshold
    effect_level: 2
    params:
      min_pct: 40                   # params_signed 未登记：卖铲子/淘金者比例（F 2.3）
  - id: RISK.BUCKET.CAP
    source: "F 4.2（高风险成长桶 ≤ 家庭可投资产 × 签署占比；默认 20%，可书面上调至 30%）"
    type: threshold
    effect_level: 1
    params:
      family_asset_max_pct: 20      # 当前签署占比（默认档，未书面上调）
      hard_ceiling_pct: 30          # 书面上调的绝对上限（F 4.2）
  - id: RISK.DRIFT.BAND
    source: "F 4.1（权重漂移 ±3pp 带内不交易；出带为监测告警而非拒绝，R15.1）"
    type: guard
    effect_level: 1
    params:
      band_pp: 3
  - id: RISK.REDLINE
    source: "F 附录 D-1/D-3（杠杆 =0、单票 ≤ 组合净值 25%；另有独立硬编码断言层 risk/redline.py）"
    type: assertion
    effect_level: 4
    conservative_direction: "红线不可参数化调整"
    params:
      single_max_param: position.redline_pct
      leverage_param: leverage
  - id: RISK.EXPECT.ADJUST
    source: "F 1.3（滚动 12 个月组合收益 >+100% → 此后 6 个月新开仓单票初始上限 -2pp，R15.2）"
    type: trigger-action
    effect_level: 2
    params:
      window_months: 12
      trailing_return_min: 1.0      # >+100%
      cap_delta_pp: 2
      validity_months: 6
      target_params:                # 单票初始上限与小盘档同步 -2pp
        - position.initial_max_pct
        - position.initial_max_pct_smallcap
  - id: RISK.DRAWDOWN.LADDER
    source: "F 6.1 回撤阶梯（-15% 冻结加仓+全面复盘 / -20% 权益降回目标下限 / -30% 防守底仓+停手一月）"
    type: trigger-action
    effect_level: 3
    params:
      freeze_at: -0.15
      deleverage_at: -0.20
      defensive_at: -0.30
      defensive_equity_max_pct: 30  # 防守底仓：权益 ≤30%
      defensive_min_score: 80       # 仅保留评分 ≥80 的标的
      halt_months: 1                # 停止主动操作一个月（停手期防守类照常，6.6）
  - id: RISK.BATCH.ENTRY
    source: "F 6.1（分 2-3 批建仓，首批 ≤ 目标仓位一半）"
    type: guard
    effect_level: 3
    params:
      min_batches: 2
      max_batches: 3
      first_batch_max_frac: 0.5
  - id: RISK.BATCH.CAP_REDUCE
    source: "F 6.1（超顶 30 个交易日内分批降回，每批 ≥ 超额部分的 1/3）"
    type: guard
    effect_level: 3
    params:
      deadline_trading_days: 30
      batch_min_divisor: 3          # 每批下限 = 超额 / 3
  - id: RISK.BATCH.TAKE_PROFIT
    source: "F 7.3（分批兑现每次兑现持仓 1/3，间隔 ≥5 个交易日）"
    type: guard
    effect_level: 2
    params:
      tranche_divisor: 3            # 每次兑现 = 持仓 / 3
      fraction_tolerance: 0.02      # 执行误差容差（实现级，只可更严）
      min_interval_trading_days: 5
  - id: RISK.COOLOFF
    source: "F 6.5-1 / 6.5-3（同一标的滚动 24h 加仓累计 >5pp → 24h 冷静期；情绪自评 ≥4 → 延长至 48h；不可豁免）"
    type: guard
    effect_level: 3
    params:
      rolling_window: "24h"         # 墙钟口径（R4.3）
      cum_add_max_pp: 5
      cooloff: "24h"
      emotion_threshold: 4
      cooloff_extended: "48h"
  - id: RISK.BUDGET.COUNTERS
    source: "F 6.5-4 / 4.1（月主动交易 ≤6 次、年主动换股 ≤6 次，两个独立计数器；框架触发的强制风控动作不计入）"
    type: guard
    effect_level: 3
    params:
      monthly_trades_param: trades.monthly_max
      annual_swaps_param: swaps.annual_max
